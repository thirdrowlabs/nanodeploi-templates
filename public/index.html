<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Live chat · WebSockets</title>
    <style>
        :root { color-scheme: light dark; --line: #e2e8f0; --muted: #64748b; --brand: #16a34a; }
        @media (prefers-color-scheme: dark) { :root { --line: #263241; --muted: #94a3b8; } }
        body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; line-height: 1.5; }
        h1 { margin: 0; } .muted { color: var(--muted); font-size: .9rem; }
        .status { display: inline-flex; align-items: center; gap: .4rem; }
        .dot { width: .5rem; height: .5rem; border-radius: 50%; background: #94a3b8; } .live .dot { background: var(--brand); }
        #log { border: 1px solid var(--line); border-radius: 12px; height: 22rem; overflow-y: auto; padding: .75rem 1rem; margin: 1.25rem 0 .75rem; }
        #log p { margin: .35rem 0; } #log b { margin-right: .4rem; } #log time { color: var(--muted); font-size: .75rem; margin-left: .4rem; }
        form { display: flex; gap: .5rem; }
        input { font: inherit; padding: .5rem .6rem; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; }
        #name { width: 8rem; } #text { flex: 1; min-width: 0; }
        button { font: inherit; padding: .5rem 1rem; border-radius: 8px; border: 0; background: var(--brand); color: #fff; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Live chat</h1>
    <p class="muted"><span id="status" class="status"><span class="dot"></span><span id="state">Connecting…</span></span> · <span id="online">0</span> online. Open this page in a second browser and chat.</p>

    <div id="log" aria-live="polite"></div>

    <form id="form">
        <input id="name" aria-label="Your name" placeholder="Name" maxlength="40">
        <input id="text" aria-label="Message" placeholder="Say hello" maxlength="500" autocomplete="off" required>
        <button type="submit">Send</button>
    </form>

    <script>
        const log = document.getElementById('log')
        const nameInput = document.getElementById('name')
        nameInput.value = localStorage.getItem('chat-name') || 'Guest ' + Math.floor(Math.random() * 900 + 100)
        let socket

        function add(message) {
            const p = document.createElement('p')
            const b = document.createElement('b')
            const time = document.createElement('time')
            b.textContent = message.name
            time.textContent = new Date(message.at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            p.append(b, message.text, time)
            log.append(p)
            log.scrollTop = log.scrollHeight
        }

        function connect() {
            const scheme = location.protocol === 'https:' ? 'wss' : 'ws'
            socket = new WebSocket(`${scheme}://${location.host}/ws`)
            socket.onopen = () => {
                document.getElementById('status').classList.add('live')
                document.getElementById('state').textContent = 'Connected'
            }
            socket.onclose = () => {
                document.getElementById('status').classList.remove('live')
                document.getElementById('state').textContent = 'Reconnecting…'
                setTimeout(connect, 2000)
            }
            socket.onmessage = (event) => {
                const data = JSON.parse(event.data)
                if (data.type === 'history') {
                    log.replaceChildren()
                    data.messages.forEach(add)
                } else if (data.type === 'presence') {
                    document.getElementById('online').textContent = data.online
                } else if (data.type === 'message') {
                    add(data)
                }
            }
        }

        document.getElementById('form').addEventListener('submit', (event) => {
            event.preventDefault()
            const text = document.getElementById('text')
            if (!text.value.trim() || socket.readyState !== WebSocket.OPEN) return
            localStorage.setItem('chat-name', nameInput.value)
            socket.send(JSON.stringify({ name: nameInput.value, text: text.value }))
            text.value = ''
        })

        connect()
    </script>
</body>
</html>
